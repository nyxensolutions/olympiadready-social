name: Handwritten one-pager reel (Mon 10 AM IST)
# Converts content/handwritten-onepager/<YYYY-MM-DD>.png → 7-sec MP4 via ffmpeg,
# then posts as an Instagram Reel (same path as handwritten-reel).
# Exits silently if no PNG exists for today — no failure, no issue opened.

on:
  workflow_dispatch:        # scheduled by cron-job.org (Mon 10 AM IST)

permissions:
  contents: write
  issues: write

concurrency:
  group: ig-bot-content
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci || npm install
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg
      - name: Post handwritten one-pager (as Reel)
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: npm run post:onepager
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `posting-failure: handwritten one-pager (${new Date().toISOString().slice(0,10)})`,
              labels: ["posting-failure"],
              body: `Workflow [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed.`
            });
