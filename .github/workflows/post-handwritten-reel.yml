name: Post Handwritten Reel (08:00 IST)

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST daily — script exits if no batch scheduled today
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to post (YYYY-MM-DD), defaults to today IST'
        required: false

permissions:
  contents: write

concurrency:
  group: ig-bot-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - run: npm ci || npm install

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Generate handwritten reel
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          fi
          node generators/generate-handwritten-reel.js "$DATE"

      - name: Post reel to Instagram
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:       ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF_NAME:         ${{ github.ref_name }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          fi
          if [ ! -f "content/reels/${DATE}-handwritten.mp4" ]; then
            echo "No reel generated for $DATE — skipping post step."
            exit 0
          fi
          node poster/post-instagram.js handwritten-reel
