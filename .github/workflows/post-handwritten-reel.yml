name: Post Handwritten Reel

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST daily (02:30 UTC) — runs every day, script exits if no batch scheduled today
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to post (YYYY-MM-DD), defaults to today'
        required: false

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Generate handwritten reel
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          fi
          node generators/generate-handwritten-reel.js "$DATE"

      - name: Post reel to Instagram
        env:
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          IG_TOKEN:      ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN:      ${{ secrets.FB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          fi
          if [ ! -f "content/reels/${DATE}-handwritten.mp4" ]; then
            echo "No reel generated for $DATE — skipping post step."
            exit 0
          fi
          node poster/post-instagram.js handwritten-reel

      - name: Commit updated queue.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social-content/handwritten/queue.json
          git diff --cached --quiet || git commit -m "chore: mark handwritten reel posted $(TZ='Asia/Kolkata' date +%Y-%m-%d)"
          git push
